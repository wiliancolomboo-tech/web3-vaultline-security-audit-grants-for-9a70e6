version: '3.8'

services:
  vaultline-sge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultline-sge-worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - VAULTLINE_PROGRAM_ID=VLinE6gP9hF3vjQ7wK2rU8mX1yT5sZ4bC9dE3gH7jKL
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"