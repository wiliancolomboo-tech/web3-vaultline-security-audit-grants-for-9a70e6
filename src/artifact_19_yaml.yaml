version: '3.8'

services:
  vaultline-telemetry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GRANT_PDA=${GRANT_PDA}
      - ALERT_EMAIL=security@colosseum.org
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"