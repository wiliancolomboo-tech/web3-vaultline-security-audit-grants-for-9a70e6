version: "3.8"

services:
  vaultline-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultline-audit-daemon
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=VLTgRt8v9bL7v7w4Kj6aM1Qn5kY7aR2hP9vS5mN4c1Z
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL_FROM=grants@vaultline.security
      - AUDIT_TRIAGE_EMAIL=security-triage@vaultline.security
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"