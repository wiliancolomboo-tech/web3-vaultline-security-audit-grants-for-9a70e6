version: "3.8"

services:
  vaultline-guardian-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultline-guardian-agent
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - DISCORD_SLACK_WEBHOOK_URL=${DISCORD_SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDITOR_SECRET_KEY=${AUDITOR_SECRET_KEY}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3