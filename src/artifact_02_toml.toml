[package]
name = "vaultline-grant-engine"
version = "0.1.0"
description = "Verifiable Security Audit Grant Protocol for Colosseum Projects"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vaultline_grant_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }