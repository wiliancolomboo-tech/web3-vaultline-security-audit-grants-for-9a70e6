version: "3.8"

services:
  vaultline-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultline-sentinel-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=V1tLineGrants1111111111111111111111111111111
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL=audit-committee@vaultline.io
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3