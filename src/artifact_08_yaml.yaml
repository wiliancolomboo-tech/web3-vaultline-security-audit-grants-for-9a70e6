version: '3.8'

services:
  vaultline-sentinel:
    build: .
    restart: always
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - PROGRAM_ID=V1tLineSecAud1tGrants111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_ALERT_EMAIL=security@colosseum.org
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3