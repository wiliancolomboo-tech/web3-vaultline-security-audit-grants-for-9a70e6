version: "3.8"

services:
  vaultline-guard-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultline_agent_daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=VLineGuard11111111111111111111111111111111
      - AUDITOR_PRIVATE_KEY=[12,34,56, ... ] # Injected via AWS Secrets Manager or Vault
      - RESEND_API_KEY=re_test_000000000000000000000000
      - SECURITY_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(process.uptime())'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"