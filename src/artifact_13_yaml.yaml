version: '3.8'

services:
  vaultline-agent:
    build: .
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=VLinEUh5h6UkmV4Q285h2c5bC6u8VwZ3Nf4xN89e17b
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISBURSEMENT_NOTIFICATION_EMAIL=${DISBURSEMENT_NOTIFICATION_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"